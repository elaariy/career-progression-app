<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card border-0 rounded-4 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <h2 class="h4 fw-bold mb-2">Start your journey</h2>
                <p class="text-secondary mb-4">Create your CareerPath account.</p>

                <form id="register-form">
                    <div class="mb-3">
                        <label for="register-name" class="form-label">Full name</label>
                        <input id="register-name" class="form-control" type="text" required>
                    </div>
                    <div class="mb-3">
                        <label for="register-email" class="form-label">Email address</label>
                        <input id="register-email" class="form-control" type="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="register-password" class="form-label">Password</label>
                        <input id="register-password" class="form-control" type="password" minlength="8" required>
                        <div class="form-text">Use at least 8 characters.</div>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Create account</button>
                    <p id="register-message" class="small mt-3 mb-0" aria-live="polite"></p>
                </form>

                <p class="mt-4 mb-0 text-secondary small">Already registered? <a href="#login">Log in</a></p>
            </div>
        </div>
    </div>
</div>
