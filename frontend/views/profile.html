<div class="container-fluid px-0">
    <div class="mb-4">
        <h2 class="h4 fw-bold mb-1">Profile</h2>
        <p class="text-secondary mb-0">View your account details and skills.</p>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-12 col-lg-8">
            <div class="card border-0 rounded-4 shadow-sm h-100">
                <div class="card-body p-4 p-lg-5">
                    <h4 class="fw-bold mb-4">Account Details</h4>
                    <div class="row g-4" id="profile-fields"></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card border-0 rounded-4 shadow-sm h-100">
                <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center mb-3 profile-avatar-large" id="profile-initials"></div>
                    <h5 class="fw-semibold mb-0 text-center" id="profile-name"></h5>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 rounded-4 shadow-sm">
        <div class="card-body p-4 p-lg-5">
            <h4 class="fw-bold mb-4">Skills</h4>
            <div class="row g-3" id="profile-skills"></div>
        </div>
    </div>
</div>
