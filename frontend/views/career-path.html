<div class="mb-4">
    <h2 class="h4 fw-bold mb-1">Career Path</h2>
    <p class="text-secondary mb-0">Explore your levels, skills and career development.</p>
</div>

<div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
        <div class="card border-0 rounded-4 shadow-sm h-100">
            <div class="card-body p-4">
                <p class="text-secondary small mb-2">CURRENT LEVEL</p>
                <h4 class="fw-bold">FR3 — Frontend Engineer 3</h4>
                <span class="badge bg-primary">Active</span>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-6">
        <div class="card border-0 rounded-4 shadow-sm h-100">
            <div class="card-body p-4">
                <p class="text-secondary small mb-2">CURRENT PROJECT</p>
                <h4 class="fw-bold">N/A</h4>
                <p class="text-secondary small mb-0">No active project assigned.</p>
            </div>
        </div>
    </div>
</div>

<h4 class="fw-bold mb-3">Career Progression Levels</h4>
<div class="row g-3 mb-4" id="career-levels"></div>

<div class="text-center mb-5">
    <button id="request-progression-button" class="btn btn-career-primary px-4">Request Progression</button>
</div>
<div id="progression-form-container"></div>

<div class="card border-0 rounded-4 shadow-sm">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-3">Reviews &amp; Comments</h4>
        <p class="text-secondary mb-3">Career development feedback will appear here.</p>
        <div class="border rounded-3 p-3 mb-3">
            <p class="small text-secondary mb-0">No reviews or comments yet.</p>
        </div>
        <form id="review-form">
            <label for="review-comment" class="form-label">Add a comment</label>
            <textarea id="review-comment" class="form-control mb-3" rows="3" placeholder="Write your feedback..." required></textarea>
            <button class="btn btn-outline-primary" type="submit">Submit Comment</button>
            <p id="review-message" class="small mt-3 mb-0" aria-live="polite"></p>
        </form>
    </div>
</div>
