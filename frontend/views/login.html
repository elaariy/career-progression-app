<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card border-0 rounded-4 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <h2 class="h4 fw-bold mb-2">Welcome back</h2>
                <p class="text-secondary mb-4">Continue your career journey.</p>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="login-email" class="form-label">Email address</label>
                        <input id="login-email" class="form-control" type="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label">Password</label>
                        <input id="login-password" class="form-control" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Log in</button>
                    <p id="login-message" class="small mt-3 mb-0" aria-live="polite"></p>
                </form>

                <p class="mt-4 mb-0 text-secondary small">New here? <a href="#register">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
